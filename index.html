<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>אלון תייר</title>
  <style>
    @font-face {
      font-family: 'Nitzotz';
      src: url('Nitzotz-Normal.woff2') format('woff2'),
           url('Nitzotz-Normal.woff') format('woff'),
           url('Nitzotz-Normal.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Nitzotz Narrow';
      src: url('Nitzotz-Narrow.woff2') format('woff2'),
           url('Nitzotz-Narrow.woff') format('woff'),
           url('Nitzotz-Narrow.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="images/albumtemptush.jpg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="socials">
      <a href="https://www.tiktok.com/@alon.tayar" aria-label="טיקטוק" target="_blank" rel="noopener">
        <img src="images/tiktok.svg" alt="טיקטוק" />
      </a>
      <a href="https://www.youtube.com/user/alontayar" aria-label="יוטיוב" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="10,8.5 16,12 10,15.5" fill="currentColor"/></svg>
      </a>
      <a href="https://www.instagram.com/alon.tayar/" aria-label="אינסטגרם" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.4" fill="currentColor"/></svg>
      </a>
    </div>
    <div class="topbar-center">
      <a class="topbar-brand" href="index.html" aria-label="אלון תייר">
        <img src="images/alontayarlogo.svg" alt="אלון תייר" />
      </a>
    </div>
    <nav class="mainnav">
      <button id="radio-toggle" class="radio-btn" aria-label="נגן רדיו" aria-pressed="false">
        <img src="images/musicoff.svg" alt="מוזיקה כבויה" class="radio-icon icon-idle" />
        <img src="images/musicon.svg" alt="מוזיקה דלוקה" class="radio-icon icon-playing" />
      </button>
      <a href="music.html" class="nav-link">מוזיקה</a>
    </nav>
  </header>

  <main class="hero">
    <img id="album-title" class="album-title" src="images/albumlogo.svg" alt="עם כל הלב" />
    <a id="album-link" href="#" target="_blank" rel="noopener">
      <img id="album-cover" class="album-art" src="images/albumtemptush.jpg" alt="עם כל הלב - עטיפת אלבום" />
    </a>
    <a id="album-listen" class="listen-link home-listen-link" href="#" target="_blank" rel="noopener">להאזנה</a>
    <p class="footer-copy">© כל הזכויות שמורות לאלון תייר 2026</p>
  </main>

  <script src="js/albums.js"></script>
  <script>
    const latest = ALBUMS[0];
    document.getElementById("album-cover").src = latest.cover;
    document.getElementById("album-cover").alt = latest.title + " - עטיפת אלבום";
    document.getElementById("album-link").href = latest.link;
    document.getElementById("album-listen").href = latest.link;
  </script>
  <script src="js/playlist.js"></script>
  <script src="js/player.js"></script>
</body>
</html>

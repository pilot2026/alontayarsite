<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מוזיקה - אלון תייר</title>
  <link rel="icon" type="image/svg+xml" href="images/album-placeholder.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="socials">
      <a href="#" aria-label="טיקטוק" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M16.6 5.82c-1.02-.9-1.6-2.2-1.6-3.62h-3.4v14.1c0 1.6-1.3 2.9-2.9 2.9s-2.9-1.3-2.9-2.9 1.3-2.9 2.9-2.9c.3 0 .58.05.85.13V9.9c-.28-.04-.56-.06-.85-.06-3.28 0-5.94 2.66-5.94 5.94S6.42 21.72 9.7 21.72s5.94-2.66 5.94-5.94V9.1c1.26.9 2.8 1.43 4.46 1.43V7.13c-1.28 0-2.46-.44-3.5-1.31z"/></svg>
      </a>
      <a href="#" aria-label="יוטיוב" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="10,8.5 16,12 10,15.5" fill="currentColor"/></svg>
      </a>
      <a href="#" aria-label="אינסטגרם" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.4" fill="currentColor"/></svg>
      </a>
    </div>
    <nav class="mainnav">
      <button id="radio-toggle" class="radio-btn" aria-label="נגן רדיו" aria-pressed="false">
        <svg class="icon-idle" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <svg class="icon-playing" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/><path d="M19 5a9 9 0 0 1 0 14l-1.4-1.4a7 7 0 0 0 0-11.2L19 5z"/></svg>
      </button>
      <a href="index.html" class="nav-link">בית</a>
    </nav>
  </header>

  <main class="music-page">
    <h1 class="page-title">מוזיקה</h1>
    <div id="albums-grid" class="albums-grid"></div>
  </main>

  <script src="js/albums.js"></script>
  <script>
    const grid = document.getElementById("albums-grid");
    ALBUMS.slice().reverse().forEach((album) => {
      const tile = document.createElement("a");
      tile.className = "album-tile";
      tile.href = album.link;
      tile.target = "_blank";
      tile.rel = "noopener";

      const img = document.createElement("img");
      img.src = album.cover;
      img.alt = album.title + " - עטיפת אלבום";

      const title = document.createElement("span");
      title.className = "album-tile-title";
      title.textContent = album.title;

      tile.appendChild(img);
      tile.appendChild(title);
      grid.appendChild(tile);
    });
  </script>
  <script src="js/playlist.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
